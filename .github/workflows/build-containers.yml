# Builds the image for amd64 + arm64 on native runners and publishes it to ghcr
# when a tag is pushed.
name: Build Containers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.arch }} \
            --pull --provenance=false --sbom=false \
            --output "type=registry,name=ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.arch }}" .

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create the multi-arch manifest
        run: |
          image=ghcr.io/${{ github.repository }}
          for tag in ${{ github.ref_name }} latest; do
            docker buildx imagetools create -t $image:$tag \
              $image:${{ github.ref_name }}-amd64 \
              $image:${{ github.ref_name }}-arm64
          done
